- name: conditioin
  hosts: local
  connection: local
  vars_prompt:
  - name: value
    prompt: please enter the value
    private: false
  tasks:
  - name: print if given value is less than
    ansible.builtin.debug:
      msg: "Given value {{value}} is less than 50"
    when: value | int < 50
  
  tasks:
  - name: print if value is greater than
    ansible.builtin.debug:
      msg: "Given value {{value}} is greater than 50"
    when: value | int > 50