- name: conditions
  hosts: local
  connection: local
  vars_prompt:
  - name: number
    prompt: please enter the value
    private: false
  tasks:
  - name: check greater than value 0f 50
    ansible.builtin.debug:
      msg: "Given {{number}} is greater than 50"
    when: number | int > 50
  
  - name: check less than value of 50
    ansible.builtin.debug:
      msg: "Given {{number}} is less than 50"
    when: number | int < 50