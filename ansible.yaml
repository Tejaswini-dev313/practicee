- name: condition
  hosts: web
  vars_prompt:
  - name: number
    prompt: enter the value
    private: no
  tasks:
  - name: check the number
    ansible.builtin.debug:
      msg: given {{number}} is less than 20
    when: number | int < 20

  - name: check the number weather greater than or not
    ansible.builtin.dubug:
      msg: given {{number}} is greater than 20
    when: number | int >= 20

