- name: create user
  hosts: web
  become: yes
  tasks:
  - name: check user weather exits or not
    ansible.builtin.command: id expense
    register: USER
    ignore_error: true
  - name: check user info
    ansible.builtin.debug:
      msg: "user info {{USER}}"
  
  - name: create user if not exist
    ansible.builtin.command: useradd expense
    when: USER.rc != 0
    